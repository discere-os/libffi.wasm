name: WASM-Native CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release
        - performance
      deploy_cdn:
        description: 'Deploy to CDN'
        required: false
        default: false
        type: boolean
      publish_npm:
        description: 'Publish to NPM'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  EMSCRIPTEN_VERSION: 4.0.14
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.0

jobs:
  # Build Matrix: WASM32/WASM64 × Debug/Release × SIMD ON/OFF
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wasm_mode: [wasm32, wasm64]
        build_type: [debug, release]
        simd: [on, off]
        include:
          - wasm_mode: wasm32
            pointer_size: 4
            bigint: false
          - wasm_mode: wasm64
            pointer_size: 8
            bigint: true
        exclude:
          # WASM64 requires BigInt, skip non-SIMD builds for efficiency
          - wasm_mode: wasm64
            simd: off

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup EMSDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSCRIPTEN_VERSION }}
        actions-cache-folder: 'emsdk-cache'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ env.PNPM_VERSION }}
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build libffi WASM (${{ matrix.wasm_mode }})
      run: |
        export SIMD_FLAG=${{ matrix.simd == 'on' && '-msimd128' || '' }}
        ./build-wasm.sh ${{ matrix.build_type }} ${{ matrix.wasm_mode }}
        
    - name: TypeScript compilation
      run: pnpm run type-check
      
    - name: Run comprehensive tests
      run: pnpm test
      
    - name: Performance benchmarks
      run: |
        pnpm run benchmark > benchmark-${{ matrix.wasm_mode }}-${{ matrix.build_type }}.txt
        cat benchmark-${{ matrix.wasm_mode }}-${{ matrix.build_type }}.txt
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libffi-${{ matrix.wasm_mode }}-${{ matrix.build_type }}-simd${{ matrix.simd }}
        path: |
          target/
          dist/
          benchmark-*.txt
        retention-days: 30

    - name: Performance Summary
      run: |
        echo "## 🚀 Performance Results (${{ matrix.wasm_mode }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: ${{ matrix.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **SIMD**: ${{ matrix.simd }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Pointer Size**: ${{ matrix.pointer_size }} bytes" >> $GITHUB_STEP_SUMMARY
        echo "- **BigInt**: ${{ matrix.bigint }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        tail -5 benchmark-${{ matrix.wasm_mode }}-${{ matrix.build_type }}.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Performance regression detection
  performance-check:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libffi-*-release-*
        
    - name: Performance regression check
      run: |
        echo "🔍 Checking performance regressions..."
        
        # Extract CIF preparation performance
        cif_perf=$(grep "CIF Preparation" */benchmark-*.txt | grep -o '[0-9,]\+' | head -1 | tr -d ',')
        
        # Performance targets from docs/WASM_NATIVE_ARCHITECTURE.md
        min_cif_perf=15000000  # 15M ops/sec minimum
        
        if [ "$cif_perf" -lt "$min_cif_perf" ]; then
          echo "❌ Performance regression detected: $cif_perf < $min_cif_perf ops/sec"
          exit 1
        else
          echo "✅ Performance target met: $cif_perf ops/sec"
        fi

  # NPM packaging and CDN distribution
  deploy:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: github.event.inputs.deploy_cdn == 'true' || github.event.inputs.publish_npm == 'true'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Setup AWS credentials
      if: github.event.inputs.deploy_cdn == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Deploy to discere.cloud CDN
      if: github.event.inputs.deploy_cdn == 'true'
      run: |
        echo "🚀 Deploying to https://cdn.discere.cloud/npm/@discere-os/libffi.wasm/"
        
        # Create CDN bundle with integrity checks
        mkdir -p cdn-bundle
        cp -r libffi-wasm32-release-*/target/* cdn-bundle/wasm32/
        cp -r libffi-wasm64-release-*/target/* cdn-bundle/wasm64/
        
        # Generate integrity hashes
        find cdn-bundle -name "*.wasm" -exec sha384sum {} \; > cdn-bundle/integrity.txt
        
        # Upload to S3/CloudFront
        aws s3 sync cdn-bundle/ s3://discere-cdn/npm/@discere-os/libffi.wasm/ \
          --cache-control "public,max-age=31536000" \
          --metadata "version=$(jq -r .version package.json)"
          
        # Invalidate CloudFront cache
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/npm/@discere-os/libffi.wasm/*"

    - name: Publish to NPM
      if: github.event.inputs.publish_npm == 'true'
      run: |
        echo "📦 Publishing to @discere-os/libffi.wasm"
        echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
        pnpm publish --no-git-checks

    - name: Deployment Summary
      run: |
        echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **CDN**: ${{ github.event.inputs.deploy_cdn == 'true' && '✅ Deployed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM**: ${{ github.event.inputs.publish_npm == 'true' && '✅ Published' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $(jq -r .version package.json)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event.inputs.deploy_cdn }}" == "true" ]; then
          echo "📡 **CDN URLs**:" >> $GITHUB_STEP_SUMMARY
          echo "- Primary: https://cdn.discere.cloud/npm/@discere-os/libffi.wasm/" >> $GITHUB_STEP_SUMMARY
          echo "- Fallback: https://cdn.jsdelivr.net/npm/@discere-os/libffi.wasm/" >> $GITHUB_STEP_SUMMARY
        fi

  # Test coverage and quality gates
  quality-gates:
    runs-on: ubuntu-latest
    needs: build-matrix
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      
    - name: Check bundle sizes
      run: |
        echo "📊 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "| Target | WASM | JS | Total |" >> $GITHUB_STEP_SUMMARY  
        echo "|--------|------|----|----- |" >> $GITHUB_STEP_SUMMARY
        
        for dir in libffi-*-release-simd*; do
          if [ -d "$dir/target" ]; then
            wasm_size=$(du -h $dir/target/libffi.wasm | cut -f1)
            js_size=$(du -h $dir/target/libffi.js | cut -f1)
            total_size=$(du -ch $dir/target/libffi.* | tail -1 | cut -f1)
            
            target=$(echo $dir | cut -d'-' -f2-4)
            echo "| $target | $wasm_size | $js_size | $total_size |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
    - name: Validate performance targets
      run: |
        echo "⚡ Performance Validation" >> $GITHUB_STEP_SUMMARY
        
        # Extract performance metrics
        cif_perf=$(grep "CIF Preparation" */benchmark-*.txt | head -1 | grep -o '[0-9,]\+' | tr -d ',')
        
        echo "- **CIF Preparation**: $cif_perf ops/sec" >> $GITHUB_STEP_SUMMARY
        
        if [ "$cif_perf" -gt "15000000" ]; then
          echo "- **Status**: ✅ Meets performance targets" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ⚠️ Below performance target (15M ops/sec)" >> $GITHUB_STEP_SUMMARY
        fi